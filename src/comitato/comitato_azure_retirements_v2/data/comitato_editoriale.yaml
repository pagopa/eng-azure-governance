  descrizione_originale_completa: >-
    Service Health: You're receiving this notification because you are associated with one or more Azure
    subscriptions that use Azure Monitor container insights. On 30 September 2026, we'll retire the ContainerLog
    table in Azure Monitor and you'll need to transition to the ContainerLogV2 table. The ContainerLogV2
    table offers all the functionality of ContainerLog, plus: Compatibility with the basic logs pricing
    tier. Additional pod and container metadata for easier querying. Support for multiline log entries.
    Recommended action To ensure your alerts and dashboards continue to work as expected, transition (https://aka.ms/containerlogmigration)
    to ContainerLogV2 by 30 September 2026. Help and support If you have questions, get answers from community
    experts in Microsoft Q&A (https://aka.ms/ContainerLogQA). If you have a support plan and need technical
    help, open the Azure portal (https://portal.azure.com/#blade/Microsoft_Azure_Support/HelpAndSupportBlade/overview)
    and select the question mark icon at the top of the page.
  link_fonti:
  - https://aka.ms/containerlogmigration
  - https://aka.ms/ContainerLogQA
