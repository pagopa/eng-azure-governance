  comitato_descrizione: ''
  comitato_retirement_date: ''
  descrizione_originale_completa: >-
    Service Health: You’re receiving this notification because one or more Azure subscriptions associated
    with your account use Microsoft Marketplace Windows Server 2022 images. You can also find this notification
    in the Azure portal under Service Health > Health advisories (https://aka.ms/AzureServiceHealthAdvisories)
    by using tracking ID 8PJS-_48. In October 2024, we announced upcoming changes to Microsoft Marketplace
    Windows Server 2022 images (https://techcommunity.microsoft.com/blog/azurecompute/incoming-changes-for-window-server-2022-marketplace-image-users/4262423).
    On 14 July 2026, we deprecated images preinstalled with .NET 6 because .NET 6 had reached the end
    of support. To avoid disruptions, migrate any affected SKUs listed below to supported Windows Server
    2022 images. Use the new offer ID (Offer ID) provided in the linked announcement. 2022-DATACENTER
    2022-DATACENTER-AZURE-EDITION 2022-DATACENTER-AZURE-EDITION-CORE 2022-DATACENTER-AZURE-EDITION-CORE-SMALLDISK
    2022-DATACENTER-AZURE-EDITION-HOTPATCH 2022-DATACENTER-AZURE-EDITION-HOTPATCH-SMALLDISK 2022-DATACENTER-AZURE-EDITION-SMALLDISK
    2022-DATACENTER-CORE 2022-DATACENTER-CORE-G2 2022-DATACENTER-CORE-SMALLDISK 2022-DATACENTER-CORE-SMALLDISK-G2
    2022-DATACENTER-G2 2022-DATACENTER-SMALLDISK 2022-DATACENTER-SMALLDISK-G2 Recommended action To avoid
    disruptions, migrate affected workloads to supported Microsoft Marketplace Windows Server 2022 images
    now. Review the .NET 6 image migration guidance (https://techcommunity.microsoft.com/blog/azurecompute/incoming-changes-for-window-server-2022-marketplace-image-users/4262423)
    to learn how to identify affected images in your subscriptions, complete the migration, and locate
    the replacement images. Help and support If you have questions or encounter issues related to the
    end of support for .NET 6 or migration to a supported version, visit the Services Hub (https://support.serviceshub.microsoft.com/supportforbusiness/onboarding?origin=/supportforbusiness/create)
    or create an Azure support request (https://learn.microsoft.com/azure/azure-portal/supportability/how-to-create-azure-support-request).
    When creating the request, select the product family Developer Tools, the product .NET, and the version
    .NET 10.
  link_fonti:
  - https://learn.microsoft.com/azure/azure-portal/supportability/how-to-create-azure-support-request
  - https://support.serviceshub.microsoft.com/supportforbusiness/onboarding?origin=/supportforbusiness/create
  - https://techcommunity.microsoft.com/blog/azurecompute/incoming-changes-for-window-server-2022-marketplace-image-users/4262423
