# Azure retirements runtime configuration.

[regions]
# Canonical Azure regions allowed in raw TSV exports.
# "global" is reserved for generic/global resources.
allowed =
    italynorth
    northeurope
    westeurope
    spaincentral
    germanywestcentral
    global

[logging]
# Persistent runtime log and operator console thresholds.
enabled = true
level = INFO
console_level = INFO
include_traceback = true

# Leave blank to use tmp/comitato/comitato_azure_retirements/run/YYYY/MM.
# Relative paths are resolved from this configuration directory.
log_directory =
