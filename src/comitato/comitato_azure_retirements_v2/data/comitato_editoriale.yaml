  descrizione_originale_completa: >-
    Service Health: You're receiving this notification because you're associated with one or more Azure
    subscriptions that use Azure Monitor Action Groups. Azure Monitor Action Groups has officially rolled
    out the new OTP feature to all regions in the Public cloud. New email addresses added to new or existing
    action groups must be verified using a one-time passcode (OTP) before they can receive notifications.
    This change is aimed at improving overall security. No immediate action is required for email addresses
    that are already configured in existing action groups. These addresses will continue to receive notifications.
    These addresses will be marked as "Legacy Allowed" after the rollout. However, adding a legacy-allowed
    email address to a new action group will require OTP verification. All new email addresses must complete
    a one-time verification within the same tenant before receiving notifications. An OTP email will be
    sent when the action group is saved, and the passcode will expire after 30 minutes. If needed, a new
    verification email can be requested from the Azure Portal Action Group blade. As part of this change,
    users will also be required to save and verify an email address before they are able to send test
    email notifications. Help and support If you have questions, get answers from community experts in
    Microsoft Q&A (https://aka.ms/azureqa). If you have a support plan and need technical help, create
    a support request. (https://learn.microsoft.com/azure/azure-portal/supportability/how-to-create-azure-support-request)
  link_fonti:
  - https://aka.ms/azureqa
  - https://learn.microsoft.com/azure/azure-portal/supportability/how-to-create-azure-support-request
