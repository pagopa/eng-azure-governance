    and password sign-in to the Azure API Management Developer Portal due to inactivity. On those instances,
    developers can't sign in or sign up with a username and password. API traffic isn't affected. What
    you need to do: Recommended: set up Microsoft Entra ID for Developer Portal sign-in. Secure access
    to developer portal - Azure API Management | Microsoft Learn (https://learn.microsoft.com/en-us/azure/api-management/secure-developer-portal-access)
    To turn username and password sign-in back on: in the Azure portal, open your API Management instance
    and go to Developer portal > Identities > + Add > Username and password. Set up Basic Authentication
    to the Developer Portal - Azure API Management | Microsoft Learn (https://learn.microsoft.com/en-us/azure/api-management/developer-portal-basic-authentication)
    Help and Support If you have questions, get answers from community experts in Microsoft Q&A (https://learn.microsoft.com/answers/tags/133/azure).
